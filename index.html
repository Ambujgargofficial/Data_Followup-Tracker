<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Followup Tracking System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Hide scrollbar for nav */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect } = React;

  // ==========================================
  // CONFIGURATION: PASTE YOUR APP SCRIPT URL HERE
  // ==========================================
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2T__s9YBHwOO7q-7zeoVznO2QcXlrpcMJ8TbUhWeaz7sz3NZ-Vfc_93uNTm9HXIX1_g/exec"; 

  const STATUS_OPTIONS = ["Hot", "Warm", "Cold", "Not Interested", "Unreachable", "Call Not Pick"];

  // Helper function to call Google Apps Script
  const fetchAPI = async (action, payload = {}) => {
    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, payload })
      });
      const result = await response.json();
      if (!result.success) throw new Error(result.error || result.message);
      return result;
    } catch (err) {
      console.error("API Error:", err);
      throw err;
    }
  };

  // --- New Date Helpers to fix timezone issues ---
  const getLocalYYYYMMDD = () => {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  };

  const normalizeDate = (dateVal) => {
    if (!dateVal) return '';
    if (typeof dateVal === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateVal.trim())) {
      return dateVal.trim();
    }
    const d = new Date(dateVal);
    if (isNaN(d.getTime())) return String(dateVal).trim();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  };

  // --- JSON Remarks Parser Helper ---
  const parseRemarks = (remarksStr) => {
    if (!remarksStr) return [];
    try {
      const parsed = JSON.parse(remarksStr);
      if (Array.isArray(parsed)) return parsed;
      return [{ date: 'Old Note', text: remarksStr, status: 'Unknown' }];
    } catch (e) {
      // Fallback for legacy plain text remarks
      return [{ date: 'Old Note', text: remarksStr, status: 'Unknown' }];
    }
  };

  const App = () => {
    const [users, setUsers] = useState([]);
    const [leads, setLeads] = useState([]);
    const [appUser, setAppUser] = useState(null); 
    const [view, setView] = useState('login'); 
    const [toastMessage, setToastMessage] = useState(null);
    const [isLoading, setIsLoading] = useState(true);
    const [isSyncing, setIsSyncing] = useState(false);

    const loadData = async () => {
      setIsSyncing(true);
      try {
        if(SCRIPT_URL === "YOUR_WEB_APP_URL_HERE") {
          setIsLoading(false);
          setIsSyncing(false);
          showToast("Please set SCRIPT_URL in index.html!");
          return;
        }
        const res = await fetchAPI('getData');
        setUsers(res.data.users);
        setLeads(res.data.leads);
      } catch (err) {
        showToast("Error loading data. Please check your internet connection.");
      }
      setIsLoading(false);
      setIsSyncing(false);
    };

    useEffect(() => {
      loadData();
    }, []);

    const showToast = (msg) => {
      setToastMessage(msg);
      setTimeout(() => setToastMessage(null), 4000);
    };

    const handleLogin = (userDoc) => {
      if (userDoc.status === 'Inactive') {
        showToast("Your account is inactive. Please contact the Admin.");
        return;
      }
      setAppUser(userDoc);
      setView('dashboard');
      showToast(`Welcome, ${userDoc.name}`);
    };

    const handleLogout = () => {
      setAppUser(null);
      setView('login');
    };

    if (isLoading) return <div className="flex h-screen items-center justify-center bg-gray-50"><p className="text-xl font-semibold"><i className="fa-solid fa-spinner fa-spin mr-2"></i> Loading App...</p></div>;

    return (
      <div className="min-h-screen pb-10">
        {toastMessage && (
          <div className="fixed top-4 right-4 z-50 bg-gray-800 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2">
            <i className="fa-solid fa-circle-check"></i>
            <span>{toastMessage}</span>
          </div>
        )}

        {appUser && (
          <nav className="bg-blue-700 text-white shadow-md sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between h-16">
                <div className="flex items-center gap-2 sm:gap-4 overflow-x-auto no-scrollbar">
                  <span className="font-bold text-lg mr-2 sm:mr-4 flex-shrink-0">LeadTrack Pro</span>
                  
                  <NavButton active={view === 'dashboard'} onClick={() => setView('dashboard')} icon="fa-clock" text="Dashboard" />
                  <NavButton active={view === 'reports'} onClick={() => setView('reports')} icon="fa-file-lines" text="Reports" />
                  
                  {appUser.role === 'Admin' && (
                    <NavButton active={view === 'users'} onClick={() => setView('users')} icon="fa-users" text="Users" />
                  )}
                </div>
                <div className="flex items-center gap-3 flex-shrink-0">
                  <button onClick={loadData} className="text-blue-200 hover:text-white" title="Refresh Data">
                    <i className={`fa-solid fa-rotate-right ${isSyncing ? 'fa-spin' : ''}`}></i>
                  </button>
                  <div className="hidden sm:block text-sm text-blue-200 border-l border-blue-500 pl-3">
                    {appUser.name} ({appUser.role})
                  </div>
                  <button onClick={handleLogout} className="p-2 hover:bg-blue-600 rounded-full transition-colors ml-1" title="Logout">
                    <i className="fa-solid fa-right-from-bracket"></i>
                  </button>
                </div>
              </div>
            </div>
          </nav>
        )}

        <main className="max-w-7xl mx-auto p-4 sm:p-6">
          {!appUser && view === 'login' && <LoginScreen users={users} onLogin={handleLogin} onForgot={() => setView('forgotPin')} />}
          {!appUser && view === 'forgotPin' && <ForgotPinScreen users={users} onBack={() => setView('login')} showToast={showToast} />}
          
          {appUser && view === 'dashboard' && appUser.role === 'Admin' && <AdminDashboard users={users} leads={leads} showToast={showToast} refreshData={loadData} isSyncing={isSyncing} />}
          {appUser && view === 'dashboard' && appUser.role === 'User' && <UserDashboard user={appUser} leads={leads} showToast={showToast} refreshData={loadData} isSyncing={isSyncing} />}
          
          {appUser && view === 'reports' && <ReportsScreen user={appUser} users={users} leads={leads} />}
          {appUser && view === 'users' && appUser.role === 'Admin' && <ManageUsersScreen users={users} showToast={showToast} refreshData={loadData} />}
        </main>
      </div>
    );
  }

  const NavButton = ({ active, onClick, icon, text }) => (
    <button 
      onClick={onClick}
      className={`flex items-center gap-1.5 px-3 py-2 rounded-md text-sm font-medium transition-colors whitespace-nowrap
        ${active ? 'bg-blue-800 text-white' : 'text-blue-100 hover:bg-blue-600 hover:text-white'}`}
    >
      <i className={`fa-solid ${icon}`}></i> {text}
    </button>
  );

  // --- 1. Login Screen ---
  const LoginScreen = ({ users, onLogin, onForgot }) => {
    const [email, setEmail] = useState('');
    const [pin, setPin] = useState('');
    const [error, setError] = useState('');

    const handleSubmit = (e) => {
      e.preventDefault();
      const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && String(u.pin) === String(pin));
      if (user) {
        setError('');
        onLogin(user);
      } else {
        setError('Invalid Email or PIN. Please check again.');
      }
    };

    return (
      <div className="max-w-md mx-auto mt-10 bg-white rounded-xl shadow-md overflow-hidden">
        <div className="bg-blue-700 p-6 text-white text-center">
          <h2 className="text-2xl font-bold">Login</h2>
          <p className="text-blue-200 mt-2">Followup Tracking System</p>
        </div>
        <form onSubmit={handleSubmit} className="p-6 space-y-4">
          {error && <div className="bg-red-100 text-red-700 p-3 rounded-md text-sm">{error}</div>}
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Email ID</label>
            <div className="relative">
              <i className="fa-solid fa-envelope absolute left-3 top-3 text-gray-400"></i>
              <input 
                type="email" required value={email} onChange={e => setEmail(e.target.value)}
                className="w-full pl-10 pr-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none" 
                placeholder="admin@test.com"
              />
            </div>
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">PIN Number</label>
            <div className="relative">
              <i className="fa-solid fa-key absolute left-3 top-3 text-gray-400"></i>
              <input 
                type="password" required value={pin} onChange={e => setPin(e.target.value)}
                className="w-full pl-10 pr-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none" 
                placeholder="****"
              />
            </div>
          </div>
          <div className="flex justify-end">
            <button type="button" onClick={onForgot} className="text-sm text-blue-600 hover:underline">
              Forgot PIN?
            </button>
          </div>
          <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-md transition-colors">
            Login
          </button>
        </form>
      </div>
    );
  };

  // --- 2. Forgot PIN / OTP Screen ---
  const ForgotPinScreen = ({ users, onBack, showToast }) => {
    const [step, setStep] = useState(1);
    const [email, setEmail] = useState('');
    const [otpInput, setOtpInput] = useState('');
    const [newPin, setNewPin] = useState('');
    const [activeUser, setActiveUser] = useState(null);
    const [error, setError] = useState('');
    const [isLoading, setIsLoading] = useState(false);

    const handleSendOtp = async (e) => {
      e.preventDefault();
      const user = users.find(u => u.email.toLowerCase() === email.toLowerCase());
      if (!user) {
        setError("No user found with this email.");
        return;
      }
      setIsLoading(true);
      const generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
      const otpTimestamp = Date.now();
      
      try {
        await fetchAPI('setOtp', { email: user.email, otp: generatedOtp, otpTimestamp });
        setActiveUser({...user, otp: generatedOtp, otpTimestamp});
        setStep(2);
        setError('');
        showToast(`An OTP has been sent to ${user.email}. (Valid for 5 mins)`);
      } catch (err) {
        setError("Error sending OTP.");
      }
      setIsLoading(false);
    };

    const handleVerifyOtp = (e) => {
      e.preventDefault();
      const now = Date.now();
      const diffMins = (now - activeUser.otpTimestamp) / 1000 / 60;
      
      if (diffMins > 5) {
        setError("OTP has expired. Please try again.");
        setStep(1);
        return;
      }

      if (String(activeUser.otp) === String(otpInput)) {
        setStep(3);
        setError('');
      } else {
        setError("Invalid OTP entered.");
      }
    };

    const handleResetPin = async (e) => {
      e.preventDefault();
      if (newPin.length < 4) {
        setError("PIN must be at least 4 digits long.");
        return;
      }
      setIsLoading(true);
      try {
        await fetchAPI('updatePin', { email: activeUser.email, newPin });
        showToast("PIN changed successfully!");
        onBack();
      } catch(err) {
        setError("Error updating PIN.");
      }
      setIsLoading(false);
    };

    return (
      <div className="max-w-md mx-auto mt-10 bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h2 className="text-xl font-bold text-gray-800 mb-4">Reset PIN</h2>
        {error && <div className="bg-red-100 text-red-700 p-3 rounded-md text-sm mb-4">{error}</div>}
        
        {step === 1 && (
          <form onSubmit={handleSendOtp} className="space-y-4">
            <p className="text-sm text-gray-600">Enter your registered email, OTP will be sent to your email.</p>
            <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3 py-2 border rounded-md" placeholder="Email ID" />
            <div className="flex gap-2">
              <button type="button" onClick={onBack} className="flex-1 border text-gray-600 py-2 rounded-md hover:bg-gray-50">Cancel</button>
              <button type="submit" disabled={isLoading} className="flex-1 bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">{isLoading?'Waiting...':'Send OTP'}</button>
            </div>
          </form>
        )}

        {step === 2 && (
          <form onSubmit={handleVerifyOtp} className="space-y-4">
            <p className="text-sm text-gray-600">Enter the 4-digit OTP sent to your email (Valid for 5 mins).</p>
            <input type="text" required maxLength="4" value={otpInput} onChange={e => setOtpInput(e.target.value)} className="w-full px-3 py-2 border rounded-md tracking-widest text-center text-lg font-bold" placeholder="X X X X" />
            <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">Verify OTP</button>
          </form>
        )}

        {step === 3 && (
          <form onSubmit={handleResetPin} className="space-y-4">
            <p className="text-sm text-gray-600">Create your new PIN.</p>
            <input type="password" required value={newPin} onChange={e => setNewPin(e.target.value)} className="w-full px-3 py-2 border rounded-md" placeholder="Enter new PIN" />
            <button type="submit" disabled={isLoading} className="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700">{isLoading?'Saving...':'Set PIN'}</button>
          </form>
        )}
      </div>
    );
  };

  // --- 3. Admin Dashboard (Lead Assignment) ---
  const AdminDashboard = ({ users, leads, showToast, refreshData, isSyncing }) => {
    const [adminTab, setAdminTab] = useState('bulk'); // 'bulk' or 'manual'
    
    // Bulk Tab States
    const [selectedModel, setSelectedModel] = useState('');
    const [selectedUsers, setSelectedUsers] = useState([]);
    const [assignType, setAssignType] = useState('Equal');
    const [equalQty, setEqualQty] = useState('');
    const [customQty, setCustomQty] = useState({});
    
    // Manual/Re-assign Tab States
    const [manualSource, setManualSource] = useState('unassigned');
    const [manualTarget, setManualTarget] = useState('');
    const [selectedManualLeads, setSelectedManualLeads] = useState([]);

    const [isAssigning, setIsAssigning] = useState(false);

    const activeUsers = users.filter(u => u.status === 'Active' && u.role === 'User');
    const unassignedLeads = leads.filter(l => !l.assignTo);
    const modelsAvailable = [...new Set(unassignedLeads.map(l => l.modelName))];
    const selectedModelLeadsCount = unassignedLeads.filter(l => l.modelName === selectedModel).length;

    // Filter leads for manual reassignment view
    const sourceLeads = manualSource === 'unassigned' 
      ? unassignedLeads 
      : leads.filter(l => l.assignTo === manualSource);

    const toggleUser = (userEmail) => {
      setSelectedUsers(prev => prev.includes(userEmail) ? prev.filter(email => email !== userEmail) : [...prev, userEmail]);
    };

    const handleCustomQtyChange = (userEmail, qty) => {
      setCustomQty(prev => ({ ...prev, [userEmail]: qty }));
    };

    const handleBulkAssign = async () => {
      if (!selectedModel) return showToast("Please select a Model Name.");
      if (selectedUsers.length === 0) return showToast("Please select at least one User.");
      
      let totalQtyNeeded = 0;
      const userAssignments = [];

      if (assignType === 'Equal') {
        const qtyPerUser = parseInt(equalQty);
        if (!qtyPerUser || qtyPerUser <= 0) return showToast("Please enter a valid quantity.");
        totalQtyNeeded = qtyPerUser * selectedUsers.length;
        selectedUsers.forEach(email => userAssignments.push({ email, qty: qtyPerUser }));
      } else {
        selectedUsers.forEach(email => {
          const q = parseInt(customQty[email]) || 0;
          totalQtyNeeded += q;
          if (q > 0) userAssignments.push({ email, qty: q });
        });
      }

      if (totalQtyNeeded === 0) return showToast("Quantity to assign must be greater than 0.");
      if (totalQtyNeeded > selectedModelLeadsCount) {
        return showToast(`Error: You are assigning ${totalQtyNeeded}, but only ${selectedModelLeadsCount} leads are available.`);
      }

      setIsAssigning(true);
      const leadsToAssign = unassignedLeads.filter(l => l.modelName === selectedModel);
      let leadIndex = 0;
      const today = getLocalYYYYMMDD();
      
      const payloadAssignments = [];

      for (let assign of userAssignments) {
        for (let i = 0; i < assign.qty; i++) {
          const lead = leadsToAssign[leadIndex];
          payloadAssignments.push({ sn: lead.sn, assignTo: assign.email, assignDate: today, type: 'New' });
          leadIndex++;
        }
      }

      executeAssignment(payloadAssignments, totalQtyNeeded, () => {
        setSelectedModel('');
        setSelectedUsers([]);
        setEqualQty('');
        setCustomQty({});
      });
    };

    const handleManualAssign = async () => {
      if (selectedManualLeads.length === 0) return showToast("Please select at least one lead.");
      if (!manualTarget) return showToast("Please select a target user to assign to.");
      
      setIsAssigning(true);
      const today = getLocalYYYYMMDD();
      const payloadAssignments = selectedManualLeads.map(sn => ({
        sn: sn,
        assignTo: manualTarget,
        assignDate: today,
        type: 'New' // Resets state to 'New' for the target user
      }));

      executeAssignment(payloadAssignments, payloadAssignments.length, () => {
        setSelectedManualLeads([]);
        setManualTarget('');
      });
    };

    const executeAssignment = async (payloadAssignments, qty, resetCallback) => {
      try {
        await fetchAPI('assignLeads', { assignments: payloadAssignments });
        showToast(`Successfully assigned ${qty} leads!`);
        resetCallback();
        refreshData();
      } catch (err) {
        showToast("Assignment failed.");
      }
      setIsAssigning(false);
    };

    const toggleManualLead = (sn) => {
      setSelectedManualLeads(prev => prev.includes(sn) ? prev.filter(item => item !== sn) : [...prev, sn]);
    };

    const selectXLeads = (x) => {
      const leadsToSelect = sourceLeads.slice(0, x).map(l => l.sn);
      setSelectedManualLeads(leadsToSelect);
    };

    return (
      <div className="space-y-6">
        <div className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
          <div>
            <h1 className="text-2xl font-bold text-gray-800">Admin Dashboard</h1>
            <p className="text-gray-500 text-sm">Assign and manage leads</p>
          </div>
          {isSyncing && <i className="fa-solid fa-spinner fa-spin text-blue-500 text-xl"></i>}
        </div>

        <div className="flex gap-2 border-b border-gray-200 pb-2">
          <button onClick={() => setAdminTab('bulk')} className={`px-4 py-2 font-medium rounded-t-lg transition-colors whitespace-nowrap ${adminTab === 'bulk' ? 'bg-blue-50 text-blue-700 border-b-2 border-blue-600' : 'text-gray-500 hover:bg-gray-50'}`}>
            Bulk Assignment
          </button>
          <button onClick={() => setAdminTab('manual')} className={`px-4 py-2 font-medium rounded-t-lg transition-colors whitespace-nowrap ${adminTab === 'manual' ? 'bg-purple-50 text-purple-700 border-b-2 border-purple-600' : 'text-gray-500 hover:bg-gray-50'}`}>
            Manual / Re-assign
          </button>
        </div>

        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          
          {adminTab === 'bulk' && (
            <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
              <div className="space-y-6">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">1. Select Model Name</label>
                  <select value={selectedModel} onChange={(e) => setSelectedModel(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Select Model --</option>
                    {modelsAvailable.map(m => (
                      <option key={m} value={m}>{m} ({unassignedLeads.filter(l=>l.modelName===m).length} Unassigned)</option>
                    ))}
                  </select>
                  {selectedModel && <p className="text-sm text-green-600 mt-1 font-medium">Available Leads: {selectedModelLeadsCount}</p>}
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">2. Select Users</label>
                  <div className="max-h-60 overflow-y-auto border border-gray-200 rounded-lg p-3 space-y-2 bg-gray-50">
                    {activeUsers.length === 0 ? <p className="text-sm text-gray-500">No Active Users.</p> : null}
                    {activeUsers.map(u => (
                      <label key={u.email} className="flex items-center gap-3 p-2 hover:bg-white rounded cursor-pointer border border-transparent hover:border-gray-200">
                        <input type="checkbox" checked={selectedUsers.includes(u.email)} onChange={() => toggleUser(u.email)} className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500" />
                        <div>
                          <div className="font-medium text-gray-800">{u.name}</div>
                          <div className="text-xs text-gray-500">{u.department} | {u.mobile}</div>
                        </div>
                      </label>
                    ))}
                  </div>
                </div>
              </div>

              <div className="space-y-6 bg-gray-50 p-5 rounded-lg border border-gray-200">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">3. Assignment Method</label>
                  <div className="flex gap-4">
                    <label className="flex items-center gap-2 cursor-pointer"><input type="radio" checked={assignType==='Equal'} onChange={()=>setAssignType('Equal')} name="atype" /> Equal</label>
                    <label className="flex items-center gap-2 cursor-pointer"><input type="radio" checked={assignType==='Custom'} onChange={()=>setAssignType('Custom')} name="atype" /> Custom</label>
                  </div>
                </div>

                {assignType === 'Equal' ? (
                  <div><label className="block text-sm font-medium text-gray-700 mb-2">Qty per User</label><input type="number" min="1" value={equalQty} onChange={(e) => setEqualQty(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5" placeholder="E.g., 50" /></div>
                ) : (
                  <div className="space-y-3">
                    <label className="block text-sm font-medium text-gray-700">Custom Qty per User</label>
                    {selectedUsers.length === 0 && <p className="text-sm text-gray-500 italic">Select users first.</p>}
                    {selectedUsers.map(email => {
                      const user = users.find(u => u.email === email);
                      return (
                        <div key={email} className="flex items-center justify-between gap-4 bg-white p-2 border rounded">
                          <span className="text-sm font-medium truncate flex-1">{user.name}</span>
                          <input type="number" min="0" placeholder="Qty" value={customQty[email] || ''} onChange={(e) => handleCustomQtyChange(email, e.target.value)} className="w-24 border border-gray-300 rounded p-1.5 text-center text-sm" />
                        </div>
                      )
                    })}
                  </div>
                )}

                <div className="pt-4 border-t border-gray-200">
                  <button onClick={handleBulkAssign} disabled={isAssigning} className="w-full bg-blue-600 text-white font-medium py-3 rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50">
                    {isAssigning ? 'Assigning...' : 'Bulk Assign Leads'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {adminTab === 'manual' && (
            <div className="p-6">
              <div className="flex flex-col md:flex-row gap-4 mb-6">
                <div className="flex-1">
                  <label className="block text-sm font-medium text-gray-700 mb-1">Source (Leads From)</label>
                  <select value={manualSource} onChange={(e) => {setManualSource(e.target.value); setSelectedManualLeads([]);}} className="w-full border border-gray-300 rounded-lg p-2.5">
                    <option value="unassigned">Unassigned Leads ({unassignedLeads.length})</option>
                    <optgroup label="Re-assign from User">
                      {activeUsers.map(u => {
                        const count = leads.filter(l => l.assignTo === u.email).length;
                        return <option key={u.email} value={u.email}>{u.name} ({count} leads)</option>
                      })}
                    </optgroup>
                  </select>
                </div>
                <div className="flex-1">
                  <label className="block text-sm font-medium text-gray-700 mb-1">Target (Assign To)</label>
                  <select value={manualTarget} onChange={(e) => setManualTarget(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5">
                    <option value="">-- Select Target User --</option>
                    {activeUsers.map(u => <option key={u.email} value={u.email} disabled={u.email === manualSource}>{u.name}</option>)}
                  </select>
                </div>
                <div className="flex items-end">
                  <button onClick={handleManualAssign} disabled={isAssigning} className="w-full md:w-auto bg-purple-600 text-white font-medium py-2.5 px-6 rounded-lg hover:bg-purple-700 transition-colors disabled:opacity-50">
                    {isAssigning ? 'Processing...' : `Assign ${selectedManualLeads.length} Selected`}
                  </button>
                </div>
              </div>

              <div className="flex gap-2 mb-4">
                <button onClick={() => selectXLeads(10)} className="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded font-medium">Select First 10</button>
                <button onClick={() => selectXLeads(20)} className="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded font-medium">Select First 20</button>
                <button onClick={() => selectXLeads(sourceLeads.length)} className="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded font-medium">Select All</button>
                <button onClick={() => setSelectedManualLeads([])} className="text-xs text-red-600 hover:bg-red-50 px-3 py-1.5 rounded font-medium ml-auto border border-red-200">Clear Selection</button>
              </div>

              <div className="border border-gray-200 rounded-lg overflow-x-auto max-h-[500px]">
                <table className="w-full text-left text-sm whitespace-nowrap">
                  <thead className="bg-gray-50 text-gray-600 border-b sticky top-0 z-10">
                    <tr>
                      <th className="p-3 w-10">
                        <input type="checkbox" onChange={(e) => setSelectedManualLeads(e.target.checked ? sourceLeads.map(l=>l.sn) : [])} checked={sourceLeads.length > 0 && selectedManualLeads.length === sourceLeads.length} className="w-4 h-4 text-purple-600 rounded" />
                      </th>
                      <th className="p-3">Customer</th>
                      <th className="p-3">Model</th>
                      <th className="p-3">Current Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {sourceLeads.length === 0 ? <tr><td colSpan="4" className="p-6 text-center text-gray-500">No leads found in this source.</td></tr> : sourceLeads.map(l => (
                      <tr key={l.sn} className="border-b hover:bg-purple-50 cursor-pointer" onClick={() => toggleManualLead(l.sn)}>
                        <td className="p-3" onClick={e=>e.stopPropagation()}>
                          <input type="checkbox" checked={selectedManualLeads.includes(l.sn)} onChange={() => toggleManualLead(l.sn)} className="w-4 h-4 text-purple-600 rounded" />
                        </td>
                        <td className="p-3"><div className="font-medium">{l.customerName}</div><div className="text-xs text-gray-500">{l.mobileNumber}</div></td>
                        <td className="p-3">{l.modelName}</td>
                        <td className="p-3">
                          {l.followUpStatus ? <span className="px-2 py-1 bg-gray-200 rounded text-xs">{l.followUpStatus}</span> : <span className="text-gray-400 italic text-xs">Pending First Call</span>}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  };

  // --- 4. User Dashboard ---
  const UserDashboard = ({ user, leads, showToast, refreshData, isSyncing }) => {
    const [activeTab, setActiveTab] = useState('New'); 

    const today = getLocalYYYYMMDD();
    const myLeads = leads.filter(l => l.assignTo === user.email);
    const newLeads = myLeads.filter(l => l.type === 'New' || !l.followUpStatus);
    const rescheduledLeads = myLeads.filter(l => l.type === 'Rescheduled' && normalizeDate(l.reScheduledDate) <= today);

    const displayLeads = activeTab === 'New' ? newLeads : rescheduledLeads;

    return (
      <div className="space-y-6">
        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
          <div>
            <h1 className="text-2xl font-bold text-gray-800">My Followups</h1>
            <p className="text-gray-500 text-sm">Call and update your assigned leads</p>
          </div>
          {isSyncing && <i className="fa-solid fa-spinner fa-spin text-blue-500 text-xl"></i>}
        </div>

        <div className="flex gap-2 border-b border-gray-200 pb-2 overflow-x-auto">
          <button onClick={() => setActiveTab('New')} className={`px-4 py-2 font-medium rounded-t-lg transition-colors whitespace-nowrap ${activeTab === 'New' ? 'bg-blue-50 text-blue-700 border-b-2 border-blue-600' : 'text-gray-500 hover:bg-gray-50'}`}>
            New Leads ({newLeads.length})
          </button>
          <button onClick={() => setActiveTab('Rescheduled')} className={`px-4 py-2 font-medium rounded-t-lg transition-colors whitespace-nowrap ${activeTab === 'Rescheduled' ? 'bg-orange-50 text-orange-700 border-b-2 border-orange-500' : 'text-gray-500 hover:bg-gray-50'}`}>
            Today's Followups ({rescheduledLeads.length})
          </button>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {displayLeads.length === 0 ? (
            <div className="col-span-full py-10 text-center text-gray-500 bg-white rounded-xl border border-gray-100 border-dashed">
              <i className="fa-solid fa-clipboard-list text-4xl mb-3 opacity-50 block"></i>
              <p>No leads in this category.</p>
            </div>
          ) : (
            displayLeads.map(lead => <LeadCard key={lead.sn} lead={lead} showToast={showToast} refreshData={refreshData} />)
          )}
        </div>
      </div>
    );
  };

  const LeadCard = ({ lead, showToast, refreshData }) => {
    const history = parseRemarks(lead.remarks);

    const [status, setStatus] = useState(lead.followUpStatus || '');
    const [date, setDate] = useState(normalizeDate(lead.reScheduledDate) || '');
    const [newRemark, setNewRemark] = useState('');
    const [isSaving, setIsSaving] = useState(false);

    const handleUpdate = async (e) => {
      e.preventDefault();
      if (!status) return showToast("Please select Followup Status.");
      if (status !== 'Not Interested' && !date) return showToast("Please select a Re-Scheduled Date.");
      if (!newRemark.trim()) return showToast("Please enter remarks.");

      let finalDate = date;
      if (status === 'Not Interested') finalDate = '';

      // Append new remark to history
      const updatedHistory = [...history, { 
        date: getLocalYYYYMMDD(), 
        status: status, 
        text: newRemark.trim() 
      }];
      
      const remarksString = JSON.stringify(updatedHistory);

      setIsSaving(true);
      try {
        await fetchAPI('updateLead', {
          sn: lead.sn, 
          followUpStatus: status, 
          reScheduledDate: finalDate, 
          remarks: remarksString, 
          type: finalDate ? 'Rescheduled' : 'Closed'
        });
        showToast("Update saved successfully!");
        refreshData();
      } catch (err) {
        showToast("Update failed.");
      }
      setIsSaving(false);
    };

    return (
      <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
        <div className="bg-gray-50 p-4 border-b border-gray-100">
          <div className="flex justify-between items-start mb-2">
            <h3 className="font-bold text-lg text-gray-800">{lead.customerName}</h3>
            <span className="text-xs font-semibold bg-gray-200 text-gray-700 px-2 py-1 rounded">SN: {lead.sn}</span>
          </div>
          <p className="text-sm text-gray-600 mb-1"><span className="font-medium">Model:</span> {lead.modelName}</p>
          <p className="text-sm text-gray-600 mb-3"><span className="font-medium">Frame:</span> {lead.frameNumber}</p>
          
          <a href={`tel:${lead.mobileNumber}`} className="flex items-center justify-center gap-2 w-full bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg font-medium transition-colors shadow-sm">
            <i className="fa-solid fa-phone-volume"></i> {lead.mobileNumber}
          </a>
        </div>

        <form onSubmit={handleUpdate} className="p-4 flex-1 flex flex-col space-y-4">
          
          {/* History Viewer (Read Only) */}
          {history.length > 0 && (
            <div>
              <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">Previous History</label>
              <div className="max-h-24 overflow-y-auto bg-gray-100 p-2 rounded border border-gray-200 shadow-inner">
                {history.map((h, i) => (
                  <div key={i} className="mb-2 border-b border-gray-200 pb-2 last:border-0 last:mb-0 last:pb-0 text-xs">
                    <div className="flex justify-between font-semibold text-gray-700 mb-0.5">
                      <span>{h.date}</span>
                      <span className="text-blue-600">{h.status}</span>
                    </div>
                    <div className="text-gray-600 break-words">{h.text}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div>
            <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">1. Followup Status <span className="text-red-500">*</span></label>
            <select value={status} onChange={(e) => setStatus(e.target.value)} required className="w-full text-sm border border-gray-300 rounded p-2 focus:ring-1 focus:ring-blue-500 outline-none">
              <option value="">-- Select Status --</option>
              {STATUS_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
            </select>
          </div>
          
          {status !== 'Not Interested' && (
            <div>
              <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">2. Re-Scheduled Date <span className="text-red-500">*</span></label>
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)} required={status !== 'Not Interested'} className="w-full text-sm border border-gray-300 rounded p-2 focus:ring-1 focus:ring-blue-500 outline-none"/>
            </div>
          )}

          <div className="flex-1">
            <label className="block text-xs font-semibold text-gray-600 uppercase mb-1">{status !== 'Not Interested' ? '3.' : '2.'} Add New Remark <span className="text-red-500">*</span></label>
            <textarea value={newRemark} onChange={(e) => setNewRemark(e.target.value)} rows="2" required className="w-full text-sm border border-gray-300 rounded p-2 focus:ring-1 focus:ring-blue-500 outline-none resize-none" placeholder="Enter new conversation remarks..."></textarea>
          </div>
          <button type="submit" disabled={isSaving} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-medium transition-colors mt-auto disabled:opacity-50">
            {isSaving ? 'Saving...' : 'Save Update'}
          </button>
        </form>
      </div>
    );
  };

  // --- 5. Reports Screen ---
  const ReportsScreen = ({ user, users, leads }) => {
    const [filterDate, setFilterDate] = useState('');
    const [filterStatus, setFilterStatus] = useState('');
    const [filterUser, setFilterUser] = useState(user.role === 'Admin' ? '' : user.email);
    
    // State for Custom Date Range
    const [isDateRange, setIsDateRange] = useState(false);
    const [startDate, setStartDate] = useState('');
    const [endDate, setEndDate] = useState('');

    const reportLeads = leads.filter(l => {
      // Only show leads that have been assigned
      if (!l.assignTo) return false;

      // User and Role Filters
      if (user.role === 'User' && l.assignTo !== user.email) return false;
      if (user.role === 'Admin' && filterUser && l.assignTo !== filterUser) return false;
      
      // Status Filter
      if (filterStatus && l.followUpStatus !== filterStatus) return false;
      
      // Date Filters (Single or Range) using normalized dates
      const normalizedAssign = normalizeDate(l.assignDate);
      const normalizedResched = normalizeDate(l.reScheduledDate);

      if (isDateRange) {
        if (startDate && endDate) {
          const hasValidAssign = normalizedAssign >= startDate && normalizedAssign <= endDate;
          const hasValidResched = normalizedResched >= startDate && normalizedResched <= endDate;
          if (!hasValidAssign && !hasValidResched) return false;
        }
      } else {
        if (filterDate && normalizedAssign !== filterDate && normalizedResched !== filterDate) return false;
      }
      
      return true;
    });

    // Calculate Summary Metrics & Status Breakdown
    const totalAssigned = reportLeads.length;
    let followupsDone = 0;
    
    const statusCounts = {};
    STATUS_OPTIONS.forEach(s => statusCounts[s] = 0);

    reportLeads.forEach(l => {
      if (l.followUpStatus) {
        followupsDone++;
        statusCounts[l.followUpStatus] = (statusCounts[l.followUpStatus] || 0) + 1;
      }
    });
    
    const pendingFollowups = totalAssigned - followupsDone;

    const clearFilters = () => {
      setFilterDate(''); 
      setStartDate('');
      setEndDate('');
      setFilterStatus(''); 
      setFilterUser(user.role === 'Admin' ? '' : user.email);
      setIsDateRange(false);
    };

    return (
      <div className="space-y-6">
        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
          <div><h1 className="text-2xl font-bold text-gray-800">Reports</h1><p className="text-gray-500 text-sm">View followup tracking details</p></div>
        </div>

        {/* Summary Metric Cards */}
        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
            <div className="bg-blue-50 border border-blue-100 p-4 rounded-xl text-center">
              <div className="text-sm font-semibold text-blue-600 mb-1 uppercase tracking-wider">Total Assigned</div>
              <div className="text-3xl font-bold text-blue-800">{totalAssigned}</div>
            </div>
            <div className="bg-green-50 border border-green-100 p-4 rounded-xl text-center">
              <div className="text-sm font-semibold text-green-600 mb-1 uppercase tracking-wider">Followups Done</div>
              <div className="text-3xl font-bold text-green-800">{followupsDone}</div>
            </div>
            <div className="bg-orange-50 border border-orange-100 p-4 rounded-xl text-center">
              <div className="text-sm font-semibold text-orange-600 mb-1 uppercase tracking-wider">Pending (Not Called)</div>
              <div className="text-3xl font-bold text-orange-800">{pendingFollowups}</div>
            </div>
          </div>
          
          {/* Status Breakdown Row */}
          <div className="flex flex-wrap gap-2 justify-center pt-3 border-t border-gray-100">
            <span className="text-xs font-semibold text-gray-500 py-1 mr-2">Status Breakdown:</span>
            {Object.entries(statusCounts).map(([status, count]) => (
              <div key={status} className="bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-xs font-medium border border-gray-200">
                {status}: <span className="font-bold text-gray-900 ml-1">{count}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
          {user.role === 'Admin' && (
            <div>
              <label className="block text-xs font-medium text-gray-500 mb-1">User Filter</label>
              <select value={filterUser} onChange={e => setFilterUser(e.target.value)} className="w-full border rounded p-2 text-sm">
                <option value="">All Users</option>
                {users.filter(u=>u.role==='User').map(u => <option key={u.email} value={u.email}>{u.name}</option>)}
              </select>
            </div>
          )}
          
          <div>
            <label className="block text-xs font-medium text-gray-500 mb-1">Status Filter</label>
            <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} className="w-full border rounded p-2 text-sm">
              <option value="">All Statuses</option>
              {STATUS_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
            </select>
          </div>
          
          <div className="relative">
            <div className="flex justify-between items-center mb-1">
              <label className="block text-xs font-medium text-gray-500">Date Filter</label>
              <button 
                onClick={() => setIsDateRange(!isDateRange)} 
                className="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded hover:bg-blue-200 transition-colors"
              >
                {isDateRange ? 'Use Single Date' : 'Custom Range'}
              </button>
            </div>
            
            {!isDateRange ? (
              <input type="date" value={filterDate} onChange={e => setFilterDate(e.target.value)} className="w-full border rounded p-2 text-sm" />
            ) : (
              <div className="flex gap-2">
                <input type="date" title="Start Date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full border rounded p-2 text-sm" />
                <input type="date" title="End Date" value={endDate} onChange={e => setEndDate(e.target.value)} className="w-full border rounded p-2 text-sm" />
              </div>
            )}
          </div>
          
          <div>
            <button onClick={clearFilters} className="w-full bg-gray-100 text-gray-600 hover:bg-gray-200 py-2 rounded text-sm font-medium transition-colors">
              Clear Filters
            </button>
          </div>
        </div>

        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
          <table className="w-full text-left text-sm whitespace-nowrap">
            <thead className="bg-gray-50 text-gray-600 border-b">
              <tr>
                <th className="p-3">SN / Customer</th>
                <th className="p-3">Mobile</th>
                <th className="p-3">Model</th>
                {user.role === 'Admin' && <th className="p-3">Assigned To</th>}
                <th className="p-3">Status</th>
                <th className="p-3">Re-Schedule</th>
                <th className="p-3 max-w-[200px]">Remarks (Hover to View All)</th>
              </tr>
            </thead>
            <tbody>
              {reportLeads.length === 0 ? <tr><td colSpan="7" className="p-6 text-center text-gray-500">No data found with these filters.</td></tr> : reportLeads.map(l => {
                const assignedUser = users.find(u => u.email === l.assignTo);
                
                // Process History for the table
                const history = parseRemarks(l.remarks);
                const latestRemark = history.length > 0 ? history[history.length - 1].text : '-';
                const tooltipText = history.length > 0 
                  ? history.map(h => `[${h.date} | ${h.status}] ${h.text}`).join('\n')
                  : 'No remarks';

                return (
                  <tr key={l.sn} className="border-b hover:bg-gray-50">
                    <td className="p-3"><div className="font-medium text-gray-800">{l.customerName}</div><div className="text-xs text-gray-500">SN: {l.sn}</div></td>
                    <td className="p-3">{l.mobileNumber}</td>
                    <td className="p-3">{l.modelName}</td>
                    {user.role === 'Admin' && <td className="p-3">{assignedUser ? assignedUser.name : '-'}</td>}
                    <td className="p-3"><span className="px-2 py-1 bg-gray-100 rounded font-medium">{l.followUpStatus || 'Pending'}</span></td>
                    <td className="p-3">{normalizeDate(l.reScheduledDate) || '-'}</td>
                    <td className="p-3 truncate max-w-[200px] cursor-help" title={tooltipText}>{latestRemark}</td>
                  </tr>
                )
              })}
            </tbody>
          </table>
        </div>
      </div>
    );
  };

  // --- 6. Manage Users Screen ---
  const ManageUsersScreen = ({ users, showToast, refreshData }) => {
    const [showForm, setShowForm] = useState(false);
    const [isSaving, setIsSaving] = useState(false);
    const [formData, setFormData] = useState({ role: 'User', name: '', department: '', mobile: '', email: '', pin: '', status: 'Active' });

    const handleSubmit = async (e) => {
      e.preventDefault();
      setIsSaving(true);
      try {
        await fetchAPI('addUser', formData);
        showToast("New User added successfully!");
        setShowForm(false);
        setFormData({ role: 'User', name: '', department: '', mobile: '', email: '', pin: '', status: 'Active' });
        refreshData();
      } catch (err) {
        showToast("Error adding user.");
      }
      setIsSaving(false);
    };

    const toggleStatus = async (user) => {
      const newStatus = user.status === 'Active' ? 'Inactive' : 'Active';
      await fetchAPI('toggleUserStatus', { email: user.email, status: newStatus });
      showToast(`${user.name} is now ${newStatus}.`);
      refreshData();
    };

    return (
      <div className="space-y-6">
        <div className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
          <div><h1 className="text-2xl font-bold text-gray-800">Manage Users</h1></div>
          <button onClick={() => setShowForm(!showForm)} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 flex items-center gap-2">
            <i className={`fa-solid ${showForm ? 'fa-xmark' : 'fa-user-plus'}`}></i> {showForm ? 'Cancel' : 'New User'}
          </button>
        </div>

        {showForm && (
          <form onSubmit={handleSubmit} className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label className="block text-xs font-medium text-gray-500 mb-1">Name</label><input required type="text" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full border rounded p-2 text-sm" /></div>
            <div><label className="block text-xs font-medium text-gray-500 mb-1">Mobile</label><input required type="text" value={formData.mobile} onChange={e=>setFormData({...formData, mobile: e.target.value})} className="w-full border rounded p-2 text-sm" /></div>
            <div><label className="block text-xs font-medium text-gray-500 mb-1">Email</label><input required type="email" value={formData.email} onChange={e=>setFormData({...formData, email: e.target.value})} className="w-full border rounded p-2 text-sm" /></div>
            <div><label className="block text-xs font-medium text-gray-500 mb-1">PIN Number</label><input required type="text" value={formData.pin} onChange={e=>setFormData({...formData, pin: e.target.value})} className="w-full border rounded p-2 text-sm" /></div>
            <div><label className="block text-xs font-medium text-gray-500 mb-1">Department</label><input required type="text" value={formData.department} onChange={e=>setFormData({...formData, department: e.target.value})} className="w-full border rounded p-2 text-sm" /></div>
            <div><label className="block text-xs font-medium text-gray-500 mb-1">Role</label><select value={formData.role} onChange={e=>setFormData({...formData, role: e.target.value})} className="w-full border rounded p-2 text-sm"><option value="User">User</option><option value="Admin">Admin</option></select></div>
            <div className="col-span-full mt-2"><button type="submit" disabled={isSaving} className="bg-green-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-green-700 disabled:opacity-50">{isSaving?'Saving...':'Save User'}</button></div>
          </form>
        )}

        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <table className="w-full text-left text-sm">
            <thead className="bg-gray-50 text-gray-600 border-b">
              <tr>
                <th className="p-3">Name / Dept</th>
                <th className="p-3">Contact</th>
                <th className="p-3">Role</th>
                <th className="p-3">Status</th>
                <th className="p-3 text-right">Action</th>
              </tr>
            </thead>
            <tbody>
              {users.map(u => (
                <tr key={u.email} className="border-b hover:bg-gray-50">
                  <td className="p-3"><div className="font-medium text-gray-800">{u.name}</div><div className="text-xs text-gray-500">{u.department}</div></td>
                  <td className="p-3"><div className="text-gray-800">{u.mobile}</div><div className="text-xs text-gray-500">{u.email}</div></td>
                  <td className="p-3"><span className={`px-2 py-1 rounded text-xs font-medium ${u.role === 'Admin' ? 'bg-purple-100 text-purple-700' : 'bg-gray-100 text-gray-700'}`}>{u.role}</span></td>
                  <td className="p-3"><span className={`px-2 py-1 rounded text-xs font-medium ${u.status === 'Active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{u.status}</span></td>
                  <td className="p-3 text-right">
                    <button onClick={() => toggleStatus(u)} className="text-xs font-medium border px-3 py-1 rounded hover:bg-gray-100">
                      {u.status === 'Active' ? 'Deactivate' : 'Activate'}
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );
  };

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
